favicon: /img/avatar-ma-yi.png
apple_touch_icon: /img/avatar-ma-yi.png
force_https: true

custom_css: /css/custom.css

dark_mode:
  enable: false
  default: light

fun_features:
  typing:
    enable: true
    typeSpeed: 58
    cursorChar: '_'
    loop: false
    scope: [home]
  progressbar:
    enable: true
    height_px: 3
    color: '#24a8a3'
    options: { showSpinner: false, trickleSpeed: 100 }

color:
  body_bg_color: '#f5faf9'
  navbar_bg_color: '#ffffff'
  navbar_text_color: '#17333a'
  subtitle_color: '#17333a'
  text_color: '#29464d'
  sec_text_color: '#6a7f83'
  board_color: '#ffffff'
  post_text_color: '#284149'
  post_heading_color: '#17333a'
  post_link_color: '#087f8c'
  link_hover_color: '#e06b5f'
  link_hover_bg_color: '#eef8f6'
  line_color: '#dbe9e6'
  scrollbar_color: '#9bc9c4'
  scrollbar_hover_color: '#58aaa3'
  button_bg_color: 'transparent'
  button_hover_bg_color: '#eaf7f4'

font:
  font_size: 16px
  font_family: '"Noto Sans SC", "Microsoft YaHei", Arial, sans-serif'
  letter_spacing: 0
  code_font_size: 88%

navbar:
  blog_title: 'Ma Yi / AI Notes'
  ground_glass:
    enable: true
    px: 8
    alpha: 0.82
  menu:
    - { key: 'home', link: '/', icon: 'iconfont icon-user-fill', name: '关于我' }
    - { key: 'projects', link: '/projects/', icon: 'iconfont icon-code', name: '科研项目' }
    - {
        key: 'notes',
        icon: 'iconfont icon-archive-fill',
        name: '学习笔记',
        submenu: [
          { key: 'blog', link: '/blog/', name: '最新文章' },
          { key: 'archive', link: '/archives/', name: '时间归档' },
          { key: 'category', link: '/categories/', name: '分类' },
          { key: 'tag', link: '/tags/', name: '标签' }
        ]
      }

search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: all
  content: true

banner:
  random_img: false
  parallax: true
  width_height_ratio: 1.0

scroll_down_arrow:
  enable: true
  banner_height_limit: 70
  scroll_after_turning_page: true

open_graph:
  enable: true
  twitter_card: summary_large_image

footer:
  content: '<span>Ma Yi 的算法手记</span> · <a href="https://hexo.io" target="_blank" rel="nofollow noopener">Hexo</a> + <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener">Fluid</a>'
  statistics:
    enable: false
  beian:
    enable: false

index:
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 88
  banner_mask_alpha: 0.08
  slogan:
    enable: true
    text: '研究模型如何思考，也记录自己如何成长。'
    api:
      enable: false
  auto_excerpt:
    enable: false
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true
  post_sticky:
    enable: true
    icon: 'iconfont icon-top'

post:
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 58
  banner_mask_alpha: 0.18
  default_index_img:
  meta:
    author:
      enable: false
    date:
      enable: true
      format: 'LL'
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 65
    views:
      enable: false
  updated:
    enable: true
    date_format: 'LL'
    relative: false
    note_class: light
  toc:
    enable: true
    expand_all: true
    placement: right
    headingSelector: 'h1,h2,h3,h4'
    collapseDepth: 2
  copyright:
    enable: true
    license: 'BY-NC-SA'
    author:
      enable: true
    post_date:
      enable: true
      format: 'LL'
    update_date:
      enable: true
      format: 'LL'
  comments:
    enable: false
  math:
    enable: true
    specific: true
    engine: katex
  mermaid:
    enable: true
    specific: true
    options: { theme: 'default' }

archive:
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 48
  banner_mask_alpha: 0.16

category:
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 48
  banner_mask_alpha: 0.16

tag:
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 48
  banner_mask_alpha: 0.16
  tagcloud:
    min_font: 15
    max_font: 27
    unit: px
    start_color: '#78bdb5'
    end_color: '#e06b5f'

about:
  enable: true
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 52
  banner_mask_alpha: 0.16
  avatar: /img/avatar-ma-yi.png
  name: 'Ma Yi'
  intro: '大模型算法求职者 · Agentic RAG / RL Post-training / LLM4Rec'
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/linshenggithub', tip: 'GitHub' }

page:
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 52
  banner_mask_alpha: 0.16

page404:
  enable: true
  banner_img: /img/hero-ai-lab.png
  banner_img_height: 85
  banner_mask_alpha: 0.12
  redirect_delay: 5000
