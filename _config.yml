# Hexo site configuration
title: Ma Yi 的算法手记
subtitle: 大模型算法、研究与学习记录
description: Ma Yi 的个人主页，记录 Agentic RAG、强化学习、大模型后训练、数据蒸馏与工程实践。
keywords:
  - 大模型算法
  - Agentic RAG
  - 强化学习
  - LLM
  - 学习笔记
author: Ma Yi
language: zh-CN
timezone: Asia/Shanghai

url: https://linshenggithub.github.io
permalink: notes/:year/:month/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false

syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
    quotes: '“”‘’'
  plugins:
    - '@traptitech/markdown-it-katex'

index_generator:
  path: ''
  per_page: 8
  order_by: -date

default_category: 学习笔记
category_map:
tag_map:

meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

per_page: 10
pagination_dir: page

theme: fluid

search:
  path: local-search.xml
  field: all
  content: true
  format: html

deploy:
  type: ''
